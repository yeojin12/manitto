<script>


/* =========================================================
   Supabase 설정

   아래 두 값은
   지금 사용 중인 값을 그대로 넣어주세요.
========================================================= */


const SUPABASE_URL =
  "https://mygchajusxkdlrfkwzlm.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_fH3oSG3Smwfmvg2fTJR2Zw_EqqWu3Jt";


let supabaseClient =
  null;



function initSupabase() {


  try {


    if (
      !window.supabase ||
      !SUPABASE_URL ||
      !SUPABASE_ANON_KEY ||
      SUPABASE_ANON_KEY.includes(
        "여기에"
      )
    ) {

      console.error(
        "Supabase 설정을 확인해주세요."
      );

      return;

    }


    supabaseClient =
      window.supabase
        .createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );


  }


  catch (error) {


    console.error(
      "Supabase 초기화 실패:",
      error
    );


  }


}



initSupabase();



function checkSupabase() {


  if (
    !supabaseClient
  ) {


    alert(
      "Supabase 연결에 문제가 있습니다."
    );


    return false;


  }


  return true;


}



/* =========================================================
   기본 미션
========================================================= */


const defaultMissions = [


  "몰래 칭찬 한마디 건네기",


  "작은 간식 챙겨주기",


  "응원 메시지 보내기",


  "도움이 필요한 순간 한 번 도와주기",


  "한 번 웃게 만들기",


  "좋은 점 하나 발견해서 알려주기",


  "부담 없는 작은 선물 주기",


  "고마웠던 점 표현하기",


  "마지막 진심 메시지 전하기"


];



/* =========================================================
   참가자 이름 입력칸
========================================================= */


function makeNameInputs() {


  const countInput =
    document.getElementById(
      "count"
    );


  const box =
    document.getElementById(
      "nameInputs"
    );


  const count =
    Number(
      countInput.value
    );


  if (
    !Number.isInteger(
      count
    ) ||
    count < 2 ||
    count > 50
  ) {


    box.innerHTML =
      "";


    return;


  }



  const oldValues =
    [
      ...box.querySelectorAll(
        ".person-name"
      )
    ]
    .map(
      input =>
        input.value
    );



  box.innerHTML =
    "";



  for (
    let i = 0;
    i < count;
    i++
  ) {


    const input =
      document.createElement(
        "input"
      );


    input.type =
      "text";


    input.className =
      "person-name";


    input.placeholder =
      `참가자 ${i + 1} 이름`;


    if (
      oldValues[i]
    ) {


      input.value =
        oldValues[i];


    }


    box.appendChild(
      input
    );


  }


}



document
  .getElementById(
    "count"
  )
  .addEventListener(
    "input",
    makeNameInputs
  );



/* =========================================================
   미션 입력칸
========================================================= */


function makeMissionInputs() {


  const box =
    document.getElementById(
      "missionInputs"
    );


  box.innerHTML =
    "";



  defaultMissions
    .forEach(
      (mission, index) => {


        const input =
          document.createElement(
            "input"
          );


        input.type =
          "text";


        input.className =
          "mission-input";


        input.placeholder =
          `미션 ${index + 1}`;


        input.value =
          mission;


        box.appendChild(
          input
        );


      }
    );


}



makeNameInputs();

makeMissionInputs();



/* =========================================================
   Fisher-Yates 랜덤 셔플
========================================================= */


function shuffle(array) {


  const result =
    [...array];


  for (
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];


  }


  return result;


}



/* =========================================================
   마니또 배정

   ★ 변경된 핵심 부분

   전체 사람을 무작위로 섞은 다음

   1번 → 2번
   2번 → 3번
   3번 → 4번
   ...
   마지막 → 1번

   형태로 하나의 큰 원을 만듦.

   예:
   여진 → 민우
   민우 → 도경
   도경 → 하은
   하은 → 신권
   신권 → 여진

   장점:
   - 자기 자신 X
   - 모든 사람 정확히 1명 담당
   - 모든 사람 정확히 1명에게 선택됨
   - 3명 이상이면 A↔B 구조 없음
   - 홀수/짝수 관계없이 작동
========================================================= */


function makeAssignments(names) {


  const shuffled =
    shuffle(
      names
    );


  const assignments =
    [];


  for (
    let i = 0;
    i < shuffled.length;
    i++
  ) {


    const giver =
      shuffled[i];


    const receiver =
      shuffled[
        (i + 1) %
        shuffled.length
      ];


    assignments.push({

      giver:
        giver,

      receiver:
        receiver

    });


  }


  return assignments;


}



/* =========================================================
   방 코드 생성
========================================================= */


function makeCode() {


  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let result =
    "";


  for (
    let i = 0;
    i < 6;
    i++
  ) {


    result +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];


  }


  return result;


}



/* =========================================================
   비밀번호 SHA256
========================================================= */


async function sha256(text) {


  const data =
    new TextEncoder()
      .encode(
        text
      );


  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );


  return [
    ...new Uint8Array(
      hash
    )
  ]

  .map(
    byte =>
      byte
        .toString(16)
        .padStart(
          2,
          "0"
        )
  )

  .join("");


}



/* =========================================================
   방 생성
========================================================= */


document
  .getElementById(
    "createBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if (
        !checkSupabase()
      ) {

        return;

      }



      const expected =
        Number(
          document
            .getElementById(
              "count"
            )
            .value
        );



      const names =
        [
          ...document
            .querySelectorAll(
              ".person-name"
            )
        ]

        .map(
          input =>
            input
              .value
              .trim()
        )

        .filter(
          Boolean
        );



      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;



      const missions =
        [
          ...document
            .querySelectorAll(
              ".mission-input"
            )
        ]

        .map(
          input =>
            input
              .value
              .trim()
        )

        .filter(
          Boolean
        );



      if (
        names.length !==
        expected
      ) {


        alert(
          `참가자 ${expected}명의 이름을 모두 입력해주세요.`
        );


        return;


      }



      if (
        new Set(
          names
        ).size !==
        names.length
      ) {


        alert(
          "중복된 이름이 있습니다."
        );


        return;


      }



      if (
        !password
      ) {


        alert(
          "관리자 비밀번호를 입력해주세요."
        );


        return;


      }



      const assignments =
        makeAssignments(
          names
        );



      const passwordHash =
        await sha256(
          password
        );



      let code;


      let error =
        null;



      for (
        let attempt = 0;
        attempt < 5;
        attempt++
      ) {


        code =
          makeCode();



        const result =
          await supabaseClient.rpc(

            "create_manitto_room",

            {


              p_code:
                code,


              p_password_hash:
                passwordHash,


              p_assignments:
                assignments,


              p_missions:
                missions.length
                  ? missions
                  : defaultMissions


            }

          );



        error =
          result.error;



        if (
          !error
        ) {

          break;

        }



        const message =
          String(
            error.message || ""
          )
          .toLowerCase();



        if (
          !message.includes(
            "duplicate"
          )
        ) {

          break;

        }


      }



      if (
        error
      ) {


        console.error(
          error
        );


        alert(
          "방 생성에 실패했습니다."
        );


        return;


      }



      document
        .getElementById(
          "roomCodeText"
        )
        .textContent =
          code;



      document
        .getElementById(
          "roomBox"
        )
        .classList
        .add(
          "show"
        );



      document
        .getElementById(
          "roomBox"
        )
        .scrollIntoView({

          behavior:
            "smooth",

          block:
            "center"

        });


    }

  );

========================================================= */


document
  .getElementById(
    "copyCodeBtn"
  )
  .addEventListener(
    "click",

    async () => {


      const code =
        document
          .getElementById(
            "roomCodeText"
          )
          .textContent;



      if (
        !code
      ) {

        return;

      }



      try {


        await navigator
          .clipboard
          .writeText(
            code
          );


        alert(
          "방 코드를 복사했습니다."
        );


      }


      catch {


        alert(
          `방 코드: ${code}`
        );


      }


    }

  );

document
  .getElementById(
    "joinBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if (
        !checkSupabase()
      ) {

        return;

      }



      const code =
        document
          .getElementById(
            "joinCode"
          )
          .value
          .trim()
          .toUpperCase();



      const name =
        document
          .getElementById(
            "joinName"
          )
          .value
          .trim();



      if (
        !code ||
        !name
      ) {


        alert(
          "방 코드와 이름을 모두 입력해주세요."
        );


        return;


      }



      const {
        data,
        error
      } =

        await supabaseClient.rpc(

          "get_my_manitto",

          {


            p_code:
              code,


            p_name:
              name


          }

        );



      if (
        error
      ) {


        console.error(
          error
        );


        alert(
          "마니또 확인 중 오류가 발생했습니다."
        );


        return;


      }



      if (
        !data ||
        data.length === 0
      ) {


        alert(
          "방 코드 또는 이름이 맞지 않습니다."
        );


        return;


      }



      document
        .getElementById(
          "targetName"
        )
        .textContent =
          data[0].receiver;



      document
        .getElementById(
          "joinResult"
        )
        .classList
        .add(
          "show"
        );



      const missionResult =
        await supabaseClient.rpc(

          "get_room_missions",

          {

            p_code:
              code

          }

        );



      const missionArea =
        document
          .getElementById(
            "missionArea"
          );


      const missionList =
        document
          .getElementById(
            "missionList"
          );



      missionList.innerHTML =
        "";



      if (
        !missionResult.error &&
        missionResult.data &&
        missionResult.data.length
      ) {


        missionResult
          .data
          .forEach(
            (
              mission,
              index
            ) => {


              const div =
                document.createElement(
                  "div"
                );


              div.className =
                "mission";


              div.innerHTML = `

                <b>
                  미션 ${String(index + 1).padStart(2, "0")}
                </b>

                <span>
                  ${escapeHtml(
                    mission.mission_text
                  )}
                </span>

              `;


              missionList
                .appendChild(
                  div
                );


            }
          );



        missionArea
          .classList
          .remove(
            "hidden"
          );


      }


    }

  );

document
  .getElementById(
    "adminBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if (
        !checkSupabase()
      ) {

        return;

      }



      const code =
        document
          .getElementById(
            "adminCode"
          )
          .value
          .trim()
          .toUpperCase();



      const password =
        document
          .getElementById(
            "adminPwCheck"
          )
          .value;



      if (
        !code ||
        !password
      ) {


        alert(
          "방 코드와 비밀번호를 모두 입력해주세요."
        );

      }



      const passwordHash =

        );



      const {

      } =

      const box =

          );

        "";



      if (
        error
      ) {


        console.error(
          error
        );


        alert(
          "전체 결과 조회 중 오류가 발생했습니다."
        );


        return;


      }



      if (
        !data ||
        data.length === 0
      ) {


        alert(
          "방 코드 또는 관리자 비밀번호가 틀렸습니다."
        );


        return;


      }



      data
        .forEach(
          person => {


            const div =
              document.createElement(
                "div"
              );


            div.className =
              "pair";


            div.textContent =
              `${person.giver} → ${person.receiver}`;


            box.appendChild(
              div
            );


          }
        );


    }

  );



/* =========================================================
   HTML 안전 처리
========================================================= */


function escapeHtml(value) {


  return String(
    value
  )
  .replace(

    /[&<>'"]/g,

    char => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      "'":
        "&#39;",

      '"':
        "&quot;"

    })[char]

  );


}
