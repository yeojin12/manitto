<script>


/* =========================================================
   Supabase
========================================================= */


const SUPABASE_URL =
  "https://mygchajusxkdlrfkwzlm.supabase.co";



const SUPABASE_ANON_KEY =
  "sb_publishable_fH3oSG3Smwfmvg2fTJR2Zw_EqqWu3Jt";


let supabaseClient =
  null;



try {

  supabaseClient =
    window.supabase
      .createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY

      );

}

catch(error) {

  console.error(
    error
  );

}



function checkSupabase() {

  if(
    !supabaseClient
  ) {

    alert(
      "Supabase 연결에 문제가 있습니다."
    );

    return false;

  }


  return true;

}



/* =========================================================
   기본 미션
========================================================= */


const defaultMissions = [

  "몰래 칭찬 한마디 건네기",

  "작은 간식 챙겨주기",

  "응원 메시지 보내기",

  "도움이 필요한 순간 한 번 도와주기",

  "한 번 웃게 만들기",

  "좋은 점 하나 발견해서 알려주기",

  "부담 없는 작은 선물 주기",

  "고마웠던 점 표현하기",

  "마지막 진심 메시지 전하기"

];



/* =========================================================
   이름 입력칸
========================================================= */


function makeNameInputs() {


  const count =
    Number(
      document
        .getElementById("count")
        .value
    );


  const box =
    document
      .getElementById(
        "nameInputs"
      );


  const oldValues =
    [
      ...box.querySelectorAll(
        ".person-name"
      )
    ]
    .map(
      x => x.value
    );


  box.innerHTML =
    "";


  if(
    count < 2 ||
    count > 50
  ) {

    return;

  }



  for(
    let i = 0;
    i < count;
    i++
  ) {


    const input =
      document.createElement(
        "input"
      );


    input.type =
      "text";


    input.className =
      "person-name";


    input.placeholder =
      `참가자 ${i + 1} 이름`;


    if(
      oldValues[i]
    ) {

      input.value =
        oldValues[i];

    }


    box.appendChild(
      input
    );

  }

}



document
  .getElementById(
    "count"
  )
  .addEventListener(
    "input",
    makeNameInputs
  );



/* =========================================================
   미션 입력칸
========================================================= */


function makeMissionInputs() {


  const box =
    document
      .getElementById(
        "missionInputs"
      );


  box.innerHTML =
    "";


  defaultMissions
    .forEach(
      (
        mission,
        index
      ) => {


        const input =
          document.createElement(
            "input"
          );


        input.type =
          "text";


        input.className =
          "mission-input";


        input.placeholder =
          `미션 ${index + 1}`;


        input.value =
          mission;


        box.appendChild(
          input
        );


      }
    );

}



makeNameInputs();

makeMissionInputs();



/* =========================================================
   랜덤
========================================================= */


function shuffle(array) {


  const result =
    [...array];


  for(
    let i =
      result.length - 1;

    i > 0;

    i--
  ) {


    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}



/* =========================================================
   전체 순환 마니또
========================================================= */


function makeAssignments(names) {


  const shuffled =
    shuffle(
      names
    );


  return shuffled.map(
    (
      giver,
      index
    ) => ({

      giver,

      receiver:

        shuffled[
          (index + 1)
          %
          shuffled.length
        ]

    })
  );

}



/* =========================================================
   방 코드
========================================================= */


function makeCode() {


  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


  let result =
    "";


  for(
    let i = 0;
    i < 6;
    i++
  ) {


    result +=
      chars[
        Math.floor(
          Math.random()
          *
          chars.length
        )
      ];

  }


  return result;

}



/* =========================================================
   SHA256
========================================================= */


async function sha256(text) {


  const data =
    new TextEncoder()
      .encode(
        text
      );


  const hash =
    await crypto.subtle
      .digest(
        "SHA-256",
        data
      );


  return [
    ...new Uint8Array(
      hash
    )
  ]
  .map(
    x =>
      x
        .toString(16)
        .padStart(
          2,
          "0"
        )
  )
  .join("");

}



/* =========================================================
   방 생성
========================================================= */


document
  .getElementById(
    "createBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if(
        !checkSupabase()
      ) {

        return;

      }


      const expected =
        Number(
          document
            .getElementById(
              "count"
            )
            .value
        );


      const names =
        [
          ...document
            .querySelectorAll(
              ".person-name"
            )
        ]
        .map(
          x =>
            x
              .value
              .trim()
        )
        .filter(
          Boolean
        );


      const password =
        document
          .getElementById(
            "adminPassword"
          )
          .value;


      const missions =
        [
          ...document
            .querySelectorAll(
              ".mission-input"
            )
        ]
        .map(
          x =>
            x
              .value
              .trim()
        )
        .filter(
          Boolean
        );


      if(
        names.length !==
        expected
      ) {

        alert(
          `참가자 ${expected}명의 이름을 모두 입력해주세요.`
        );

        return;

      }


      if(
        new Set(names).size !==
        names.length
      ) {

        alert(
          "중복된 이름이 있습니다."
        );

        return;

      }


      if(
        !password
      ) {

        alert(
          "관리자 비밀번호를 입력해주세요."
        );

        return;

      }


      const assignments =
        makeAssignments(
          names
        );


      const passwordHash =
        await sha256(
          password
        );


      let code;

      let error;


      for(
        let attempt = 0;
        attempt < 5;
        attempt++
      ) {


        code =
          makeCode();


        const result =
          await supabaseClient.rpc(

            "create_manitto_room",

            {

              p_code:
                code,

              p_password_hash:
                passwordHash,

              p_assignments:
                assignments,

              p_missions:
                missions

            }

          );


        error =
          result.error;


        if(
          !error
        ) {

          break;

        }


        if(
          !String(
            error.message || ""
          )
          .toLowerCase()
          .includes(
            "duplicate"
          )
        ) {

          break;

        }

      }


      if(
        error
      ) {

        console.error(
          error
        );

        alert(
          "방 생성에 실패했습니다."
        );

        return;

      }


      document
        .getElementById(
          "roomCodeText"
        )
        .textContent =
          code;


      document
        .getElementById(
          "roomBox"
        )
        .classList
        .add(
          "show"
        );


    }

  );



/* =========================================================
   방 코드 복사
========================================================= */


document
  .getElementById(
    "copyCodeBtn"
  )
  .addEventListener(
    "click",

    async () => {


      const code =
        document
          .getElementById(
            "roomCodeText"
          )
          .textContent;


      try {

        await navigator
          .clipboard
          .writeText(
            code
          );


        alert(
          "방 코드를 복사했습니다."
        );

      }

      catch {

        alert(
          `방 코드: ${code}`
        );

      }


    }

  );



/* =========================================================
   내 마니또 + 미션 진행상태
========================================================= */


document
  .getElementById(
    "joinBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if(
        !checkSupabase()
      ) {

        return;

      }


      const code =
        document
          .getElementById(
            "joinCode"
          )
          .value
          .trim()
          .toUpperCase();


      const name =
        document
          .getElementById(
            "joinName"
          )
          .value
          .trim();


      if(
        !code ||
        !name
      ) {

        alert(
          "방 코드와 이름을 입력해주세요."
        );

        return;

      }



      const manittoResult =
        await supabaseClient.rpc(

          "get_my_manitto",

          {

            p_code:
              code,

            p_name:
              name

          }

        );



      if(
        manittoResult.error
      ) {

        console.error(
          manittoResult.error
        );

        alert(
          "조회 중 오류가 발생했습니다."
        );

        return;

      }



      if(
        !manittoResult.data ||
        manittoResult.data.length === 0
      ) {

        alert(
          "방 코드 또는 이름이 맞지 않습니다."
        );

        return;

      }



      document
        .getElementById(
          "targetName"
        )
        .textContent =
          manittoResult
            .data[0]
            .receiver;



      document
        .getElementById(
          "joinResult"
        )
        .classList
        .add(
          "show"
        );



      await loadMissionProgress(
        code,
        name
      );


    }

  );



/* =========================================================
   미션 진행상태 불러오기
========================================================= */


async function loadMissionProgress(
  code,
  name
) {


  const result =
    await supabaseClient.rpc(

      "get_participant_missions",

      {

        p_code:
          code,

        p_name:
          name

      }

    );


  if(
    result.error
  ) {

    console.error(
      result.error
    );

    alert(
      "미션 진행상태를 불러오지 못했습니다."
    );

    return;

  }


  const missions =
    result.data || [];


  const list =
    document
      .getElementById(
        "missionList"
      );


  list.innerHTML =
    "";



  missions.forEach(
    mission => {


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "mission";


      if(
        mission.completed
      ) {

        item.classList.add(
          "completed"
        );

      }



      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.className =
        "mission-checkbox";


      checkbox.checked =
        mission.completed;



      const text =
        document.createElement(
          "div"
        );


      text.className =
        "mission-text";


      text.innerHTML = `

        <span class="mission-number">
          미션 ${String(
            mission.sort_order
          ).padStart(
            2,
            "0"
          )}
        </span>

        <div>
          ${escapeHtml(
            mission.mission_text
          )}
        </div>

        <div
          class="mission-done"
          style="${
            mission.completed
              ? ""
              : "display:none;"
          }"
        >
          ✓ 완료
        </div>

      `;



      checkbox
        .addEventListener(
          "change",

          async () => {


            checkbox.disabled =
              true;


            const saveResult =
              await supabaseClient.rpc(

                "set_mission_progress",

                {

                  p_code:
                    code,

                  p_name:
                    name,

                  p_mission_id:
                    mission.mission_id,

                  p_completed:
                    checkbox.checked

                }

              );


            checkbox.disabled =
              false;



            if(
              saveResult.error ||
              saveResult.data !== true
            ) {


              console.error(
                saveResult.error
              );


              checkbox.checked =
                !checkbox.checked;


              alert(
                "미션 상태 저장에 실패했습니다."
              );


              return;

            }



            await loadMissionProgress(
              code,
              name
            );


          }

        );



      item.appendChild(
        checkbox
      );


      item.appendChild(
        text
      );


      list.appendChild(
        item
      );


    }
  );



  updateProgress(
    missions
  );



  document
    .getElementById(
      "missionArea"
    )
    .classList
    .remove(
      "hidden"
    );


}



/* =========================================================
   진행률 계산
========================================================= */


function updateProgress(
  missions
) {


  const total =
    missions.length;


  const completed =
    missions.filter(
      x =>
        x.completed
    )
    .length;


  document
    .getElementById(
      "missionCount"
    )
    .textContent =
      `${completed} / ${total} 완료`;



  const percent =

    total === 0

      ? 0

      : (
          completed /
          total
        ) * 100;



  document
    .getElementById(
      "progressBar"
    )
    .style
    .width =
      `${percent}%`;


}



/* =========================================================
   관리자
========================================================= */


document
  .getElementById(
    "adminBtn"
  )
  .addEventListener(
    "click",

    async () => {


      if(
        !checkSupabase()
      ) {

        return;

      }


      const code =
        document
          .getElementById(
            "adminCode"
          )
          .value
          .trim()
          .toUpperCase();


      const password =
        document
          .getElementById(
            "adminPwCheck"
          )
          .value;


      if(
        !code ||
        !password
      ) {

        alert(
          "방 코드와 비밀번호를 입력해주세요."
        );

        return;

      }


      const hash =
        await sha256(
          password
        );


      const result =
        await supabaseClient.rpc(

          "admin_get_assignments",

          {

            p_code:
              code,

            p_password_hash:
              hash

          }

        );


      const box =
        document
          .getElementById(
            "adminResults"
          );


      box.innerHTML =
        "";


      if(
        result.error
      ) {

        console.error(
          result.error
        );

        alert(
          "조회 중 오류가 발생했습니다."
        );

        return;

      }


      if(
        !result.data ||
        result.data.length === 0
      ) {

        alert(
          "방 코드 또는 관리자 비밀번호가 틀렸습니다."
        );

        return;

      }



      result.data
        .forEach(
          person => {


            const div =
              document.createElement(
                "div"
              );


            div.className =
              "pair";


            div.textContent =
              `${person.giver} → ${person.receiver}`;


            box.appendChild(
              div
            );


          }
        );


    }

  );



/* =========================================================
   HTML 안전처리
========================================================= */


function escapeHtml(value) {


  return String(
    value
  )
  .replace(

    /[&<>'"]/g,

    char => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      "'":"&#39;",

      '"':"&quot;"

    })[char]

  );


}
